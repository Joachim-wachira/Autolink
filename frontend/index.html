<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mech | Smart Automotive Services</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="landing-page">
    <!-- Animated Background -->
    <div class="stars"></div>
    <div class="aurora"></div>

    <!-- Hero Section -->
    <main class="hero-section">
        <div class="hero-content">
            <!-- Logo -->
            <div class="logo-container">
                <div class="logo-ring">
                    <img src="logo.PNG">
                </div>
            </div>

            <!-- Brand Title -->
            <h1 class="hero-title">Mech</h1>
            
            <!-- Description -->
            <p class="hero-description">
                Connecting drivers with qualified and trusted mechanics, spareshops and emergency team
            </p>

            <!-- CTA Section -->
            <div class="hero-cta">
                <p class="prompt-text">Get started as...</p>
                
                <div class="button-group">
                    <a href="register_driver.html" class="btn btn-driver">
                        <span>Driver</span>
                    </a>
                    <a href="register_mechanic.html" class="btn btn-mechanic">
                        <span>Mechanic</span>
                    </a>
                    <a href="register_spareshop.html" class="btn btn-spareshop">
                        <span>Spareshop</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <footer> <p>&copy 2026. Mech allrights reserved</p></footer>
</body>
</html>
